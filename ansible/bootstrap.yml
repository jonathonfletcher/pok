---
# =============================================================================
# bootstrap.yml  —  kubeadm bootstrap: node prep -> init primary -> join the rest
# =============================================================================
# WHEN    : recreate step 4 (after os_prep.yml, prepare.yml, and DNS is live)
# TARGETS : kube_cluster (5 plays — see the play banners below)
# NEEDS   : steps 1-3; ../registry/certs/<provider>/ca.crt present; the API name resolves
#           (bhyve k8s.homelab.lan / aws k8s.demo.internal).
#           After this, nodes are NotReady until `cd ../tf/k8s && make apply` installs Cilium.
# DOCS    : ansible/README.md  ("bootstrap.yml — the one with cross-play plumbing")
# =============================================================================
#
# kube-proxy is skipped at init (Cilium provides kube-proxy-replacement), so there
# is nothing to remove afterwards.
#
# WARNING / VALIDATION STATUS: the init/join plays below are validated by
# --syntax-check and ansible-lint only. They are NOT exercised against the live
# cluster (that would require re-initialising it). They codify the documented
# manual procedure; treat a first real run as a fresh-cluster operation.

# ── Play 0: pre-flight on the control node ────────────────────────────────────
- name: Pre-flight — required local artifacts exist
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    # Only when this provider self-hosts the registry (manage_registry — true for bhyve + aws).
    - name: Stat the generated registry CA
      ansible.builtin.stat:
        path: "{{ kube_registry_trust_ca_src }}"
      register: bootstrap_registry_ca
      when: manage_registry | default(true)

    - name: Fail early if the registry CA is missing
      ansible.builtin.assert:
        that:
          - bootstrap_registry_ca.stat.exists
        fail_msg: >-
          registry CA ({{ kube_registry_trust_ca_src }}) is missing — the kube_registry_trust
          role (Play 1) copies it to every node. Run `ansible-playbook prepare.yml`
          before bootstrap.yml.
        quiet: true
      when: manage_registry | default(true)

# ── Play 1: every node — make it a Kubernetes-ready node ──────────────────────
- name: Node readiness (identity, containerd, kube packages, registry trust)
  hosts: kube_cluster
  become: true
  roles:
    - role: node_identity
      tags: [node_identity]
    - role: kube_containerd
      tags: [kube_containerd]
    - role: kube_packages
      tags: [kube_packages]
    - role: kube_registry_trust
      tags: [kube_registry_trust]
      when: manage_registry | default(true)

# ── Play 2: initialise the first control-plane ───────────────────────────────
- name: Initialise the primary control-plane
  hosts: primary_cp
  become: true
  # kubeadm_join too: this play sets join_command/certificate_key (idempotent on an already
  # initialised CP), which Plays 3/4 consume — so `--tags kubeadm_join` can run standalone.
  tags: [kubeadm_init, kubeadm_join]
  # control_plane_endpoint / pod_cidr / service_cidr are provider-specific — they live
  # in inventory/<provider>/group_vars/all.yml (bhyve vs aws), not hardcoded here.
  tasks:
    - name: Is the control-plane already initialised?
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: bootstrap_adminconf

    - name: Run kubeadm init (skip kube-proxy — Cilium provides KPR)
      ansible.builtin.command:
        cmd: >-
          kubeadm init
          --pod-network-cidr={{ pod_cidr }}
          --service-cidr={{ service_cidr }}
          --control-plane-endpoint={{ control_plane_endpoint }}
          {% if apiserver_cert_extra_sans | default([]) | length > 0 %}--apiserver-cert-extra-sans={{ apiserver_cert_extra_sans | join(',') }}{% endif %}
          --upload-certs
          --skip-phases=addon/kube-proxy
          --node-name={{ inventory_hostname }}
      when: not bootstrap_adminconf.stat.exists
      register: bootstrap_init
      changed_when: bootstrap_init.rc == 0

    - name: Install admin kubeconfig for the ubuntu user
      block:
        - name: Ensure ~ubuntu/.kube exists
          ansible.builtin.file:
            path: /home/ubuntu/.kube
            state: directory
            owner: ubuntu
            group: ubuntu
            mode: "0755"
        - name: Copy admin.conf to ~ubuntu/.kube/config
          ansible.builtin.copy:
            src: /etc/kubernetes/admin.conf
            dest: /home/ubuntu/.kube/config
            remote_src: true
            owner: ubuntu
            group: ubuntu
            mode: "0600"

    - name: Get the worker join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: bootstrap_join_cmd
      changed_when: false
      no_log: true # output contains a bootstrap token

    - name: Upload certs and get a fresh certificate-key (for control-plane joins)
      ansible.builtin.command: kubeadm init phase upload-certs --upload-certs
      register: bootstrap_upload_certs
      changed_when: false
      no_log: true # output contains the certificate-key that decrypts kubeadm-certs

    - name: Publish join artifacts to the other plays
      ansible.builtin.set_fact:
        join_command: "{{ bootstrap_join_cmd.stdout | trim }}"
        certificate_key: "{{ bootstrap_upload_certs.stdout_lines | last | trim }}"
      no_log: true # token + certificate-key

# ── Play 3: join the secondary control-planes ────────────────────────────────
- name: Join secondary control-planes
  hosts: secondary_cp
  become: true
  tags: [kubeadm_join]
  tasks:
    - name: Already joined?
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: bootstrap_kubelet_cp

    - name: Run kubeadm join --control-plane
      ansible.builtin.command:
        cmd: >-
          {{ hostvars[groups['primary_cp'][0]].join_command }}
          --control-plane
          --certificate-key {{ hostvars[groups['primary_cp'][0]].certificate_key }}
          --node-name {{ inventory_hostname }}
      when: not bootstrap_kubelet_cp.stat.exists
      register: bootstrap_cp_join
      changed_when: bootstrap_cp_join.rc == 0
      no_log: true # command line embeds the token + certificate-key

# ── Play 4: join the workers ─────────────────────────────────────────────────
- name: Join workers
  hosts: workers
  become: true
  tags: [kubeadm_join]
  tasks:
    - name: Already joined?
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: bootstrap_kubelet_w

    - name: Run kubeadm join (worker)
      ansible.builtin.command:
        cmd: "{{ hostvars[groups['primary_cp'][0]].join_command }} --node-name {{ inventory_hostname }}"
      when: not bootstrap_kubelet_w.stat.exists
      register: bootstrap_w_join
      changed_when: bootstrap_w_join.rc == 0
      no_log: true # command line embeds the bootstrap token
