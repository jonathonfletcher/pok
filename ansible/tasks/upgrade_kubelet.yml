---
# Shared by upgrade.yml: drain this node, move kubelet+kubectl to
# kube_packages_version, restart the kubelet, uncordon, wait for Ready.
#
# `upgrade_kubectl_host` is where kubectl runs (the node itself for control planes,
# the primary CP for workers — workers carry no admin kubeconfig).
- name: Drain {{ inventory_hostname }}
  ansible.builtin.command: >-
    kubectl drain {{ inventory_hostname }}
    --ignore-daemonsets --delete-emptydir-data --timeout=300s
  delegate_to: "{{ upgrade_kubectl_host }}"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: upgrade_running_version != kube_upgrade_version
  register: upgrade_drain
  changed_when: upgrade_drain.rc == 0

- name: Unhold kubelet + kubectl
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: install
  loop: [kubelet, kubectl]

- name: Install kubelet + kubectl {{ kube_packages_version }}
  ansible.builtin.apt:
    name:
      - "kubelet={{ kube_packages_version }}"
      - "kubectl={{ kube_packages_version }}"
    state: present
    allow_downgrade: true

- name: Re-hold kubelet + kubectl
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [kubelet, kubectl]
  when: kube_packages_hold | bool

- name: Restart the kubelet on the new binary
  ansible.builtin.systemd_service:
    name: kubelet
    state: restarted
    daemon_reload: true
  # Not a handler on purpose: the restart must land BEFORE the uncordon below, and a
  # second restart on an already-upgraded node is harmless.
  when: upgrade_running_version != kube_upgrade_version

- name: Uncordon {{ inventory_hostname }}
  ansible.builtin.command: kubectl uncordon {{ inventory_hostname }}
  delegate_to: "{{ upgrade_kubectl_host }}"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: upgrade_running_version != kube_upgrade_version
  register: upgrade_uncordon
  changed_when: upgrade_uncordon.rc == 0

- name: Wait for Ready after the kubelet restart on {{ inventory_hostname }}
  ansible.builtin.command: >-
    kubectl wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=300s
  delegate_to: "{{ upgrade_kubectl_host }}"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false

- name: Confirm the kubelet version reported by {{ inventory_hostname }}
  ansible.builtin.command: >-
    kubectl get node {{ inventory_hostname }} -o jsonpath={.status.nodeInfo.kubeletVersion}
  delegate_to: "{{ upgrade_kubectl_host }}"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: upgrade_reported
  changed_when: false
  failed_when: upgrade_reported.stdout != 'v' ~ kube_upgrade_version
