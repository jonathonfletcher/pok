[defaults]
roles_path = roles
remote_user = ubuntu
host_key_checking = False
retry_files_enabled = False
interpreter_python = /usr/bin/python3
# NOTE: the prettier `stdout_callback = yaml` needs the community.general
# collection. Left on ansible-core defaults to stay collection-free. To enable it:
#   ./.venv/bin/ansible-galaxy collection install community.general
#   then set: stdout_callback = community.general.yaml

[privilege_escalation]
become = True
become_method = sudo
