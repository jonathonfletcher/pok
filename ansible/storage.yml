---
# =============================================================================
# storage.yml  —  grow the PV, create ubuntu-data-lv, build topolvm-vg
# =============================================================================
# WHEN    : recreate step 5 (after bootstrap; before the tofu TopoLVM install)
# TARGETS : kube_cluster (all nodes: bhyve 10 / aws 6)
# NEEDS (bhyve only): each VM's disk0 zvol grown +16G on the bhyve host FIRST (ubuntu-vg is
#           otherwise full) — MANUAL: zfs set volsize=80G <pool>/<vm>/disk0.img && vm restart <vm>
# DOCS    : ansible/README.md  (run-order table); ../tf/k8s/helm_topolvm.tf consumes topolvm-vg
# =============================================================================
# Usage: ansible-playbook storage.yml
#        ansible-playbook storage.yml -e node_data_lv_mount=/opt/local-path-provisioner
- name: Create the data LV on cluster nodes
  hosts: kube_cluster
  become: true
  roles:
    # bhyve grows disk0 into ubuntu-data-lv; aws has a dedicated data disk already, so
    # node_data_lv is skipped there (manage_data_lv=false in aws group_vars).
    - role: node_data_lv
      tags: [node_data_lv]
      when: manage_data_lv | default(true)
    # Dedicated VG for TopoLVM — bhyve: nested on ubuntu-data-lv; aws: whole nvme1n1.
    - role: node_topolvm_vg
      tags: [node_topolvm_vg]
