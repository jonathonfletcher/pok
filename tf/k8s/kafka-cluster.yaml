# Kafka in KRaft mode (Strimzi) — the cluster CRs.
#
# kubectl-applied by `make services` AFTER the Strimzi operator (helm_kafka.tf)
# registers its CRDs — NOT via OpenTofu (kubernetes_manifest would need a plan-time
# CRD that doesn't exist yet). Same pattern as lb-pool.yaml.
#
# Topology: separate controller pool (KRaft quorum) + broker pool (data plane).
# Storage: per-node LVM via the topolvm-provisioner StorageClass (topolvm-vg on the
# worker nodes). Brokers spread across workers (pod anti-affinity); both pools avoid
# the tainted control-planes automatically.
#
# Access: internal-only. In-cluster clients use the internal listener on 9094
# (main-kafka-bootstrap.kafka.svc:9094). No external LoadBalancer listeners —
# nothing outside the cluster consumes Kafka, so no kafka-pool VIPs are used.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: controller
  namespace: kafka
  labels:
    strimzi.io/cluster: main
spec:
  replicas: 3
  roles:
    - controller
  # Sized from observed peak memory usage (Honeycomb k8s metrics) so peak stays <=85% of the limit.
  # Workers are t4g.medium; ~1 broker + 1 controller land per worker. Controller peak ~446Mi -> 640Mi (~70%).
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 640Mi
  jvmOptions:
    -Xms: 256m
    -Xmx: 256m
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 2Gi
        class: topolvm-provisioner
        kraftMetadata: shared
        deleteClaim: false
  template:
    pod:
      # Spread the 3 KRaft controllers across worker nodes so a single node loss can't take
      # more than one quorum member (mirrors the broker pool's rule). Soft (preferred) so a
      # constrained cluster still schedules.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    strimzi.io/cluster: main
                    strimzi.io/pool-name: controller
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  namespace: kafka
  labels:
    strimzi.io/cluster: main
spec:
  replicas: 3
  roles:
    - broker
  # Sized from observed peak memory usage (Honeycomb k8s metrics) so peak stays <=85% of the limit.
  # Workers are t4g.medium; ~1 broker + 1 controller land per worker. Broker peak ~1061Mi -> 1536Mi (~69%).
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1536Mi
  jvmOptions:
    -Xms: 512m
    -Xmx: 512m
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        class: topolvm-provisioner
        kraftMetadata: shared
        deleteClaim: false
  template:
    pod:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    strimzi.io/cluster: main
                    strimzi.io/pool-name: broker
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: main
  namespace: kafka
spec:
  kafka:
    version: 4.3.0
    metadataVersion: 4.3-IV0
    listeners:
      - name: internal
        port: 9094
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    # Re-baselined from WARMED per-container steady state (Honeycomb kubeletstats container group).
    # The prior 240Mi was set from cold, just-restarted readings (~171Mi); warmed, both operators
    # plateau at ~206Mi (p95 0.86) and spike to ~228Mi (0.95) — over band and flapping the 90% OOM
    # trigger. 288Mi each -> ~72% steady / ~79% peak (60-80% band); request 224Mi ~= steady usage.
    topicOperator:
      resources:
        requests:
          cpu: 100m
          memory: 224Mi
        limits:
          memory: 288Mi
    userOperator:
      resources:
        requests:
          cpu: 100m
          memory: 224Mi
        limits:
          memory: 288Mi
