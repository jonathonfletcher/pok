# edge — single external front door (reverse proxy) for the live-feed stack.
# LoadBalancer on the apps-pool VIP (bhyve 172.23.20.240); routes /ws, /hw, /* to the
# in-cluster ClusterIP Services. The existing external reverse proxy already points at .240.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  namespace: app-livefeed
  labels:
    app: edge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edge
  template:
    metadata:
      labels:
        app: edge
    spec:
      terminationGracePeriodSeconds: 15
      # Spread the 2 replicas across nodes so a single node loss/drain can't take the whole
      # front door (soft: ScheduleAnyway, so a small/one-node cluster still schedules).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: edge
      containers:
        - name: edge
          image: registry.homelab.lan:5000/edge:v0.1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: WS_UPSTREAM
              value: "http://wsfeed.app-livefeed.svc.cluster.local:80"
            - name: HW_UPSTREAM
              value: "http://helloworld.app-helloworld.svc.cluster.local:80"
            - name: STATIC_UPSTREAM
              value: "http://static.app-livefeed.svc.cluster.local:80"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-agent.honeycomb.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_SERVICE_NAME
              value: "edge"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=cluster"
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 24Mi }
            limits: { memory: 64Mi }
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: edge
  namespace: app-livefeed
  labels:
    app: edge
  # No IP pin — the apps-pool holds a single IP on each provider, so Cilium assigns it
  # automatically (bhyve 172.23.20.240, aws 10.0.20.240). Provider-neutral.
spec:
  type: LoadBalancer
  selector:
    app: edge
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: edge
  namespace: app-livefeed
  labels:
    app: edge
spec:
  minAvailable: 1 # keep the front door up through a voluntary disruption (node drain)
  selector:
    matchLabels:
      app: edge
