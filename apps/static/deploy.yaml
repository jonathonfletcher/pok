# static — cluster-live-feed frontend (Namespace + Deployment + Service).
# Pure static file server; the live data comes from wsfeed over /ws (same origin via the
# gateway). Image from the private registry; `make deploy` advances the running Deployment.
---
apiVersion: v1
kind: Namespace
metadata:
  name: app-livefeed
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: static
  namespace: app-livefeed
  labels:
    app: static
spec:
  replicas: 2
  selector:
    matchLabels:
      app: static
  template:
    metadata:
      labels:
        app: static
    spec:
      terminationGracePeriodSeconds: 15
      # Spread the 2 replicas across nodes so a single node loss/drain can't take all static
      # serving (soft: ScheduleAnyway, so a small/one-node cluster still schedules).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: static
      containers:
        - name: static
          image: registry.homelab.lan:5000/static:v0.1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            # OTLP/gRPC to the agent via a ClusterIP Service. hostPort (HOST_IP:4317) is not
            # enabled in this cluster, so we target the Service instead. http:// => plaintext
            # (the agent listener is not TLS).
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-agent.honeycomb.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_SERVICE_NAME
              value: "static"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=cluster"
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 24Mi }
            limits: { memory: 64Mi }
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: static
  namespace: app-livefeed
  labels:
    app: static
spec:
  # ClusterIP: the edge reverse proxy is the single external front door (LoadBalancer).
  type: ClusterIP
  selector:
    app: static
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: static
  namespace: app-livefeed
  labels:
    app: static
spec:
  minAvailable: 1 # keep static serving through a voluntary disruption (node drain)
  selector:
    matchLabels:
      app: static
